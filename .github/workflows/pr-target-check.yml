name: PR Target Branch Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-target:
    runs-on: ubuntu-latest
    # Skip develop→master PRs (maintainer releases)
    if: >-
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.ref != 'develop'
    steps:
      - name: Fail wrong-base PRs
        uses: actions/github-script@v7
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch;
            core.setFailed([
              'This PR targets `master`, but all PRs should target the `develop` branch.',
              '',
              'Please update the base branch:',
              '1. Click Edit at the top right of this PR',
              '2. Change the base branch from `master` to `develop`',
              '',
              `See CONTRIBUTING.md: https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/CONTRIBUTING.md`,
            ].join('\n'));
